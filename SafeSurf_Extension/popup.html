<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe-Surf | Extension</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.8);
            --accent-primary: #1d9bf0;
            --accent-success: #00ff88;
            --accent-warning: #ffd700;
            --accent-danger: #ff4d4d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            width: 380px;
            overflow-x: hidden;
            border-radius: 12px;
            min-height: 400px;
        }

        .container {
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: white;
        }

        .logo span {
            color: var(--accent-primary);
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.loading { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
        .status-badge.secure { background: rgba(0, 255, 136, 0.1); color: var(--accent-success); border: 1px solid rgba(0, 255, 136, 0.3); }
        .status-badge.warning { background: rgba(255, 215, 0, 0.1); color: var(--accent-warning); border: 1px solid rgba(255, 215, 0, 0.3); }
        .status-badge.danger { background: rgba(255, 77, 77, 0.1); color: var(--accent-danger); border: 1px solid rgba(255, 77, 77, 0.3); }

        .scan-target {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            word-break: break-all;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-primary);
        }

        .risk-gauge {
            text-align: center;
            margin: 1.5rem 0;
        }

        .risk-value {
            font-size: 3.5rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .risk-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .intelligence-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            border-left: 4px solid var(--accent-primary);
            font-size: 0.9rem;
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .footer {
            margin-top: 2rem;
            padding: 1rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #1d9bf0 0%, #0072b1 100%);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(29, 155, 240, 0.1);
            border-left-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="risk-label" style="color: var(--accent-primary);">Analyzing Neural Link...</p>
        <p id="loading-timer" style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">0s elapsed — Deep scan in progress</p>
    </div>

    <header>
        <div class="logo">SAFE-<span>SURF</span></div>
        <div id="status-badge" class="status-badge loading">Scanning</div>
    </header>

    <div class="container">
        <div id="target-url" class="scan-target">Initializing...</div>

        <div class="risk-gauge">
            <div id="risk-score" class="risk-value">--</div>
            <div id="risk-intensity" class="risk-label">Threat Intensity Index</div>
        </div>

        <div id="briefing-container">
            <div class="stat-label" style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Agent Briefing</div>
            <div id="agent-brief" class="intelligence-box">
                Analyzing session data...
            </div>
        </div>

        <div id="heuristic-reasons" style="margin-top: 1.5rem; display: none;">
            <div class="stat-label" style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px;">Anomalies Detected</div>
            <div id="anomalies-list" style="font-size: 0.8rem; color: var(--accent-warning);">
                <!-- Reasons will be injected here -->
            </div>
        </div>

        <button id="rescan-btn" class="btn-action">
            &#x21BB; Force Re-Scan
        </button>
    </div>

    <div class="footer">
        Safe-Surf v2.1 | Neural Phishing Protection
    </div>

    <script src="js/popup.js"></script>
</body>
</html>
